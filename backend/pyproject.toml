[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "KvikStaff-api"
version = "0.1.0"
description = "KvikStaff FastAPI backend"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120,<1.0",
  "uvicorn[standard]>=0.38,<1.0",
  "pydantic>=2.12,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "SQLAlchemy[asyncio]>=2.0,<3.0",
  "asyncpg>=0.30,<1.0",
  "alembic>=1.17,<2.0",
  "PyJWT[crypto]>=2.10,<3.0",
  "httpx>=0.28,<1.0",
  "redis>=7.0,<8.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-asyncio>=1.2,<2.0",
  "ruff>=0.14,<1.0",
  "mypy>=1.18,<2.0",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
