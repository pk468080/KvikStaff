name: TempStaff quality

on:
  push:
    branches:
      - main
      - development
      - "audit/**"
  pull_request:

jobs:
  admin:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin-dashboard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-dashboard/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run build

  customer:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: customer-app/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test -- --runInBand

  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-app

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-app/package-lock.json

      - run: npm ci
      - run: npx tsc --noEmit