
name: Database Integration Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  db-integration:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check migration history consistency
        run: python3 scripts/check_migration_history.py

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.121.0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend test dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Prepare isolated database configuration
        run: |
          mkdir -p /tmp/kvikstaff-ci/supabase
          cp supabase/config.toml /tmp/kvikstaff-ci/supabase/config.toml

          python3 - <<'PY'
          from pathlib import Path

          path = Path("/tmp/kvikstaff-ci/supabase/config.toml")
          lines = path.read_text().splitlines()

          project_id_line = 'project_id = "KvikStaff"'
          if project_id_line not in lines:
              raise SystemExit("Expected project_id not found in Supabase config")

          lines[lines.index(project_id_line)] = 'project_id = "kvikstaffci"'

          section = ""
          changed = set()

          for index, line in enumerate(lines):
              stripped = line.strip()

              if stripped.startswith("[") and stripped.endswith("]"):
                  section = stripped
              elif (
                  section in {"[db.migrations]", "[db.seed]"}
                  and stripped == "enabled = true"
              ):
                  lines[index] = line.replace("true", "false")
                  changed.add(section)

          expected = {"[db.migrations]", "[db.seed]"}
          if changed != expected:
              raise SystemExit(
                  f"Could not disable migrations and seeds safely: {changed}"
              )

          path.write_text("\n".join(lines) + "\n")
          print("Temporary config ready; migrations and seeds are disabled.")
          PY

      - name: Start disposable PostgreSQL database
        run: supabase --workdir /tmp/kvikstaff-ci db start

      - name: Install required database extensions
        run: |
          docker exec supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS postgis WITH SCHEMA public;"

          docker exec supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            -c "CREATE EXTENSION IF NOT EXISTS btree_gist WITH SCHEMA extensions;"

      - name: Import schema-only test baseline
        run: |
          test -s supabase/tests/fixtures/kvikstaff_schema_baseline.sql

          docker exec -i supabase_db_kvikstaffci \
            psql -U postgres -d postgres \
            -v ON_ERROR_STOP=1 --single-transaction \
            < supabase/tests/fixtures/kvikstaff_schema_baseline.sql

      # The checked-in schema-only fixture is a checkpoint immediately before
      # 20261015111844. This is not a from-empty migration replay.
      - name: Replay all migrations after the schema checkpoint
        env:
          SCHEMA_BASELINE_VERSION: "20261015111843"
        shell: bash
        run: |
          set -euo pipefail

          replayed=0
          migrations=(supabase/migrations/[0-9]*.sql)

          if [[ ! -f "${migrations[0]}" ]]; then
            echo "ERROR: no timestamped migration files found"
            exit 1
          fi

          for migration in "${migrations[@]}"; do
            filename="${migration##*/}"
            version="${filename%%_*}"

            if [[ "$version" > "$SCHEMA_BASELINE_VERSION" ]]; then
              # This is CI fixture preparation, not a production migration.
              # Normalize the schema-only fixture before the F-07 grants.
              if [[ "$version" == "20261016122925" ]]; then
                echo "Applying CI-only SECURITY DEFINER grant normalization"
                docker exec -i supabase_db_kvikstaffci \
                  psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
                  < supabase/tests/fixtures/normalize_public_security_definer_grants.sql
              fi

              echo "Replaying migration: $filename"
              docker exec -i supabase_db_kvikstaffci \
                psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
                < "$migration"

              replayed=$((replayed + 1))
            fi
          done

          echo "Replayed $replayed committed migrations after checkpoint $SCHEMA_BASELINE_VERSION"

          # Update this expected count when the replay checkpoint or committed
          # migration set intentionally changes.
          if [[ "$replayed" -ne 18 ]]; then
            echo "ERROR: expected 18 migrations after the schema checkpoint, got $replayed"
            exit 1
          fi

      - name: Verify worker profile privacy restrictions
        run: |
          docker exec -i supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/test_worker_profile_privacy.sql

      - name: Verify worker payout reversal transition
        run: |
          docker exec -i supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/test_worker_payout_reversal_transition.sql

      - name: Test SECURITY DEFINER grants and role guards
        run: |
          docker exec -i supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/test_security_definer_access.sql

      - name: Test active-account guards for SECURITY DEFINER RPCs
        run: |
          docker exec -i supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/test_security_definer_active_accounts.sql

      - name: Test F-07 RLS authorization matrix
        run: |
          docker exec -i supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/test_rls_authorization_matrix.sql

      - name: Test F-08 migration security grants
        run: |
          docker exec -i supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 \
            < supabase/tests/test_migration_history_security_grants.sql

      - name: Verify baseline tables are empty
        run: |
          docker exec supabase_db_kvikstaffci \
            psql -U postgres -d postgres -v ON_ERROR_STOP=1 -tA \
            -c "SELECT
                  (SELECT count(*) = 0 FROM public.bookings)
                  AND (SELECT count(*) = 0 FROM public.profiles)
                  AND (SELECT count(*) = 0 FROM public.worker_profiles)
                  AND (SELECT count(*) = 0 FROM public.booking_worker_offers)
                  AND (SELECT count(*) = 0 FROM public.booking_schedule_occurrences);" \
            | grep -qx t

      - name: Run database integration tests
        working-directory: backend
        env:
          ENVIRONMENT: test
          DATABASE_URL: postgresql+asyncpg://postgres:postgres@127.0.0.1:54322/postgres
        run: python -m pytest tests/integration/ -v
